<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="310" viewBox="0 0 1180 310">
  <title>UXU-Ilhan logo</title>
  <desc>Two U-shaped channels connected by crossed rails and a live interaction node, paired with the UXU-Ilhan wordmark.</desc>
  <g transform="translate(18 42) scale(1.05)">
      <!-- The two U channels: UX and UI, mirrored around the shared center -->
      <path d="M 74 28 V 113 C 74 141 91 158 119 158 H 145 C 173 158 190 141 190 113 V 28"
            fill="none" stroke="#F0F4F1" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 230 28 V 113 C 230 141 247 158 275 158 H 301 C 329 158 346 141 346 113 V 28"
            fill="none" stroke="#F0F4F1" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Crossing rails: one route is highlighted to express the two implementations -->
      <path d="M 168 59 L 252 133" fill="none" stroke="#F0F4F1" stroke-width="17" stroke-linecap="round"/>
      <path d="M 252 59 L 168 133" fill="none" stroke="#3BDF89" stroke-width="17" stroke-linecap="round"/>
      <!-- Live interaction point / cursor node -->
      <circle cx="210" cy="96" r="19" fill="#101412" stroke="#3BDF89" stroke-width="5"/>
      <circle cx="210" cy="96" r="5" fill="#3BDF89"/>
      <!-- Subtle orbit trace, a nod to the orbit and glow components -->
      <path d="M 172 96 A 38 19 0 0 1 248 96" fill="none" stroke="#3BDF89" stroke-width="2.5" stroke-dasharray="3 8" opacity=".75"/>
    </g>
  <text x="500" y="169" fill="#F0F4F1" font-family="DejaVu Sans, Arial, sans-serif" font-size="112" font-weight="700" letter-spacing="-6">UX<tspan fill="#3BDF89">U</tspan></text>
  <text x="886" y="165" fill="#A2AEA7" font-family="DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="500" letter-spacing="7">ILHAN</text>
  <path d="M 500 198 H 1105" stroke="#2B3530" stroke-width="2"/>
  <text x="502" y="241" fill="#A2AEA7" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" letter-spacing="3.4">USER EXPERIENCE × USER INTERFACE</text>
  <text x="502" y="278" fill="#65736B" font-family="DejaVu Sans Mono, monospace" font-size="15" letter-spacing="2.2">COMPONENT PLAYGROUND  ·  REACT / VANILLA</text>
</svg>